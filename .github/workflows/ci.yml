name: CI

# Docs- and legacy-only changes skip CI: no test or deploy step reads markdown,
# the SPA build doesn't either, and legacy/ is unmaintained (its only in-repo
# reader is gen_base_times.py, which CI never runs). paths-ignore only skips when
# *every* changed file matches, so a PR touching docs *and* code still runs the
# full job.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'legacy/**']
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'legacy/**']

permissions:
  id-token: write   # mint the OIDC token
  contents: read

# Two master pushes must not run overlapping s3 syncs. Not cancel-in-progress:
# a half-finished sync is worse than a queued one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: st-scrape/requirements-dev.txt

      - name: Install Python deps
        run: pip install -r requirements-dev.txt
        working-directory: st-scrape

      # moto-backed: no network, no AWS credentials needed.
      - name: st-scrape tests
        run: python -m pytest -q
        working-directory: st-scrape

      # A separate venv: swimtrends-app pins aws-cdk-lib, which st-scrape does
      # not install. Assertion tests only — they synth templates in-process and
      # touch no AWS. Nothing here deploys a stack: every CDK stack in this repo
      # is deployed by hand, because the deploy needs `-c alert_email` passed on
      # the command line (see CLAUDE.md).
      - name: CDK assertion tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m pytest tests/unit -q
        working-directory: swimtrends-app

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: web tests
        run: npm test
        working-directory: web

      - name: Assume the deploy role
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # Data (/data/*.json) is NOT touched here — see the spec.
      - name: Deploy the SPA
        if: github.ref == 'refs/heads/master'
        run: make web-deploy AWS_PROFILE_FLAG=
